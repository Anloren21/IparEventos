<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabecera(titulo)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${titulo} + ' | IparEventos'">IparEventos</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>

<body>

	<nav th:fragment="menu" class="navbar bg-dark" data-bs-theme="dark"
		aria-label="Navegación principal">

		<div class="container d-flex flex-wrap gap-3">

			<a class="navbar-brand fw-bold" th:href="@{/}"> IparEventos </a>

			<div class="d-flex flex-wrap align-items-center gap-3">

				<a class="nav-link text-white" th:href="@{/}"> Eventos </a> <a
					sec:authorize="isAnonymous()" class="nav-link text-white"
					th:href="@{/registro}"> Crear cuenta </a> <a
					sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm"
					th:href="@{/login}"> Iniciar sesión </a> <a
					sec:authorize="isAuthenticated()" class="nav-link text-white"
					th:href="@{/inscripciones}"> Mis inscripciones </a> <a
					sec:authorize="hasRole('ADMINISTRADOR')"
					class="nav-link text-white" th:href="@{/admin}"> Administración
				</a> <span sec:authorize="isAuthenticated()" class="text-white">
					Hola, <span sec:authentication="principal.nombre"></span>
				</span>

				<form sec:authorize="isAuthenticated()" th:action="@{/logout}"
					method="post" class="m-0">

					<button type="submit" class="btn btn-outline-light btn-sm">
						Cerrar sesión</button>

				</form>

			</div>
		</div>
	</nav>
	<div th:fragment="alertas">
		<div th:if="${alerta != null}" class="alert alert-success"
			role="status" th:text="${alerta}"></div>

		<div th:if="${error != null}" class="alert alert-danger" role="alert"
			th:text="${error}"></div>
	</div>

	<footer th:fragment="pie" class="border-top mt-5 py-4">
		<div class="container text-center text-secondary">
			<p class="mb-0">IparEventos · Gestión de eventos e inscripciones
			</p>
		</div>
	</footer>

</body>
</html>
