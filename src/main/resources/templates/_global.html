<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabecera(titulo)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${titulo} + ' | IparEventos'">IparEventos</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>

<body>

	<nav th:fragment="menu" class="navbar bg-dark" data-bs-theme="dark"
		aria-label="Navegación principal">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/}"> IparEventos </a> <a
				class="nav-link text-white" th:href="@{/}"> Eventos </a>
		</div>
	</nav>

	<div th:fragment="alertas">
		<div th:if="${alerta != null}" class="alert alert-success"
			role="status" th:text="${alerta}"></div>

		<div th:if="${error != null}" class="alert alert-danger" role="alert"
			th:text="${error}"></div>
	</div>

	<footer th:fragment="pie" class="border-top mt-5 py-4">
		<div class="container text-center text-secondary">
			<p class="mb-0">IparEventos · Gestión de eventos e inscripciones
			</p>
		</div>
	</footer>

</body>
</html>
