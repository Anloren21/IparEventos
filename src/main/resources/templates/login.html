<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{_global :: cabecera('Iniciar sesión')}"></head>

<body class="bg-light">

	<nav th:replace="~{_global :: menu}"></nav>

	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-5">

				<div class="card shadow-sm">
					<div class="card-body p-4">

						<h1 class="h3 mb-4">Iniciar sesión</h1>

						<div th:if="${param.error != null}" class="alert alert-danger"
							role="alert">El correo o la contraseña no son correctos.</div>

						<div th:if="${param.logout != null}" class="alert alert-success"
							role="status">Has cerrado sesión correctamente.</div>

						<form th:action="@{/login}" method="post">

							<div class="mb-3">
								<label for="username" class="form-label"> Correo
									electrónico </label> <input type="email" id="username" name="username"
									class="form-control" autocomplete="username" required autofocus>
							</div>

							<div class="mb-4">
								<label for="password" class="form-label"> Contraseña </label> <input
									type="password" id="password" name="password"
									class="form-control" autocomplete="current-password" required>
							</div>

							<button type="submit" class="btn btn-primary w-100">
								Entrar</button>

						</form>

						<p class="text-center mt-4 mb-0">
							¿Todavía no tienes cuenta? <a th:href="@{/registro}">Regístrate</a>
						</p>

					</div>
				</div>

			</div>
		</div>
	</main>

	<footer th:replace="~{_global :: pie}"></footer>

</body>
</html>
