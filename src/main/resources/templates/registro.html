<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{_global :: cabecera('Crear cuenta')}"></head>

<body class="bg-light">

	<nav th:replace="~{_global :: menu}"></nav>

	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">

				<div class="card shadow-sm">
					<div class="card-body p-4">

						<h1 class="h3 mb-3">Crear cuenta</h1>

						<p class="text-secondary">Regístrate para inscribirte en
							nuestros eventos.</p>

						<form th:action="@{/registro}" th:object="${usuarioFormModel}"
							method="post">

							<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"
								role="alert">Revisa los campos indicados. Vuelve a
								introducir la contraseña.</div>

							<div class="mb-3">
								<label for="nombre" class="form-label"> Nombre </label> <input
									type="text" th:field="*{nombre}" class="form-control"
									th:errorclass="is-invalid" autocomplete="name"
									aria-describedby="nombreError" required>

								<div id="nombreError" class="invalid-feedback"
									th:errors="*{nombre}"></div>
							</div>

							<div class="mb-3">
								<label for="email" class="form-label"> Correo
									electrónico </label> <input type="email" th:field="*{email}"
									class="form-control" th:errorclass="is-invalid"
									autocomplete="email" aria-describedby="emailError" required>

								<div id="emailError" class="invalid-feedback"
									th:errors="*{email}"></div>
							</div>

							<div class="mb-4">
								<label for="password" class="form-label"> Contraseña </label> <input
									type="password" th:field="*{password}" class="form-control"
									th:errorclass="is-invalid" autocomplete="new-password"
									aria-describedby="passwordError" required>

								<div id="passwordError" class="invalid-feedback"
									th:errors="*{password}"></div>
							</div>

							<button type="submit" class="btn btn-primary w-100">
								Crear cuenta</button>

							<a th:href="@{/}" class="btn btn-link w-100 mt-2"> Volver al
								inicio </a>

						</form>

					</div>
				</div>

			</div>
		</div>
	</main>

	<footer th:replace="~{_global :: pie}"></footer>

</body>
</html>
