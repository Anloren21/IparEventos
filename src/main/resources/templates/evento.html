<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{_global :: cabecera(${evento.titulo})}"></head>

<body class="bg-light">

	<nav th:replace="~{_global :: menu}"></nav>

	<main class="container py-5">

		<div th:replace="~{_global :: alertas}"></div>

		<a th:href="@{/}" class="btn btn-outline-secondary mb-4"> Volver a
			los eventos </a>

		<article class="card shadow-sm">
			<div class="card-body p-4">

				<div class="mb-3">
					<span th:each="categoria : ${evento.categorias}"
						class="badge text-bg-secondary me-1" th:text="${categoria.nombre}">
					</span>
				</div>

				<h1 class="mb-4" th:text="${evento.titulo}">Título del evento</h1>

				<p th:if="${!#strings.isEmpty(evento.descripcion)}"
					th:text="${evento.descripcion}" style="white-space: pre-line;">
				</p>

				<dl class="row mt-4">

					<dt class="col-sm-3">Fecha y hora</dt>
					<dd class="col-sm-9"
						th:text="${#temporals.format(
                            evento.fecha, 'dd/MM/yyyy HH:mm')}">
					</dd>

					<dt class="col-sm-3">Precio por plaza</dt>
					<dd class="col-sm-9"
						th:text="${#numbers.formatDecimal(
                            evento.precio, 1, 'POINT', 2, 'COMMA')} + ' €'">
					</dd>

					<dt class="col-sm-3">Aforo total</dt>
					<dd class="col-sm-9" th:text="${evento.aforo}"></dd>

					<dt class="col-sm-3">Plazas disponibles</dt>
					<dd class="col-sm-9" th:text="${evento.plazasDisponibles}"></dd>

				</dl>

				<div th:if="${!eventoFuturo}" class="alert alert-secondary"
					role="status">Este evento ya ha comenzado o ha finalizado. No
					admite nuevas inscripciones.</div>

				<div
					th:if="${eventoFuturo
                             and evento.plazasDisponibles <= 0}"
					class="alert alert-warning" role="status">Aforo completo. No
					quedan plazas disponibles.</div>

				<div
					th:if="${eventoFuturo
                             and evento.plazasDisponibles > 0}"
					class="alert alert-success" role="status">Hay plazas
					disponibles para este evento.</div>

			</div>
		</article>

	</main>

	<footer th:replace="~{_global :: pie}"></footer>

</body>
</html>
