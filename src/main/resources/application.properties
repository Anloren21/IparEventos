spring.application.name=ipareventos

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ipareventos
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Creacion y actualizacion de tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Acceso a datos dentro de la capa de servicios
spring.jpa.open-in-view=false

# Desactivar cache de plantillas durante el desarrollo
spring.thymeleaf.cache=false

server.port=8080